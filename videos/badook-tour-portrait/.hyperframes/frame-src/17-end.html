  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="17-end"]') || document;
      function el(name) {
        return scope.querySelector('[id="17-end-' + name + '"]') || document.getElementById("17-end-" + name);
      }

      var DUR = 8.895;
      var GLOW_PEAK = 0.28;
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.4s): the logo blooms in at center on "באדוק" with a soft brown glow behind it ──
      // ambient-glow-bloom (hero bloom): glow and logo land as ONE beat at 1.4s
      tl.fromTo(el("glow"), { opacity: 0, scale: 0.82 }, { opacity: GLOW_PEAK, scale: 1, duration: 1.05, ease: "power2.out" }, 0.35);
      tl.fromTo(el("logo"),
        { opacity: 0, scale: 0.84, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.05, ease: "power3.out" }, 0.35);

      // ── Scene 2 (1.4–4.7s): the line, per word (RTL: first word first), two lines ──
      [["w1", 1.5], ["w2", 1.85], ["w3", 2.25], ["w4", 2.55], ["w5", 2.9]].forEach(function (pair) {
        tl.fromTo(el(pair[0]),
          { opacity: 0, y: 44, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.75, ease: "power3.out" }, pair[1]);
      });
      // brown underline draws under "במקום אחד." at 3.5s (right → left, reading direction)
      // (the svg stays hidden until the draw starts, so the round cap never shows as a stray dot)
      tl.fromTo(el("underline"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 3.5);
      tl.fromTo(el("underline-path"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 3.5);

      // ── Scene 3 (4.7–8.895s): "יוצאים לדרך" — the lockup steps back, the CTA lands as the hero ──
      // lockup yields: logo + line rise a touch and step down a size so the pill is the largest element

      tl.fromTo(el("line"), { y: 0, scale: 1 }, { y: -66, scale: 0.84, duration: 0.85, ease: "power3.inOut", immediateRender: false }, 4.62);
      // the glow migrates from the logo to sit behind the CTA pill (the new hero)
      tl.fromTo(el("glow"), { y: 0, scale: 1 }, { y: 540, scale: 0.92, duration: 0.95, ease: "power3.inOut", immediateRender: false }, 4.65);

      // the big brown pill "שימוש חינם" springs in smoothly at 4.8s (no overshoot)

        { opacity: 0, scale: 0.7, y: 50 },
        { opacity: 1, scale: 1, y: 0, duration: 0.85, ease: "power3.out" }, 4.8);
      tl.fromTo(el("pill-text"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.95);

      // supporting line (5.4s) and URL (5.9s)
      tl.fromTo(el("lead"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.4);
      tl.fromTo(el("url"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 5.9);

      // hold: one raked sheen pass across the pill (right → left, single pass)
      tl.fromTo(el("sheen"), { x: 900, opacity: 0 }, { x: -260, opacity: 0.6, duration: 1.2, ease: "none" }, 6.5);
      tl.to(el("sheen"), { opacity: 0, duration: 0.3, ease: "power1.in" }, 7.4);

      // hold: bounded glow breathe behind the pill (finite phase tween, no repeat)
      var core = el("glow-core");
      var phase = { p: 0 };
      tl.fromTo(phase, { p: 0 }, {
        p: Math.PI * 2,
        duration: 2.75,
        ease: "none",
        immediateRender: false,
        onUpdate: function () {
          var s = Math.sin(phase.p);
          core.style.opacity = String(0.9 + s * 0.1);
          core.style.transform = "scale(" + (1 + s * 0.02) + ")";
        }
      }, 5.55);

      // ── the film's only exit: the whole card fades to cream over the last 0.6s ──
      tl.fromTo(el("card"), { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false }, DUR - 0.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["17-end"] = tl;
    })();
