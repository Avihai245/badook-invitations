      function stagePhone(xCss, yCss) { return [PH_X + BEZEL + xCss * P, PH_Y + BEZEL + yCss * P]; }
      function arc(a, d, from, to) {
        var x0 = from[0], y0 = from[1], x1 = to[0] + 14, y1 = to[1];
        var lift = 80;
        var path = "M" + x0 + " " + y0 + " C" + (x0 - 40) + " " + (Math.min(y0, y1) - lift) + ", " + (x1 + 60) + " " + (Math.min(y0, y1) - lift) + ", " + x1 + " " + y1;
        el(a).setAttribute("d", path);
        el(a + "-halo").setAttribute("d", path);
        el(d).setAttribute("cx", x1);
        el(d).setAttribute("cy", y1);
      }
      arc("a1", "d1", stageField(BOX.fieldOpen[0], INPUT_OPEN_CY), stagePhone(PBOX.open[0] + PBOX.open[2], PBOX.open[1] + PBOX.open[3] / 2));
      arc("a2", "d2", stageField(BOX.fieldPlace[0], INPUT_PLACE_CY), stagePhone(PBOX.place[0] + PBOX.place[2], PBOX.place[1] + PBOX.place[3] / 2));

      // ── zoom-to-target on the preview phone (1.25×, nudged right so it stays inside the frame) ──
      var Z = 1.25, ZX = 40;
      var phCx = PH_X + PH_W / 2, phCy = PH_Y + PH_H / 2;

      // feature chip: centred on the phone, straddling its top edge (zoomed state, then rest state)
      var chipAnchor = el("chip-anchor");
      chipAnchor.style.left = (phCx - 260) + "px";
      chipAnchor.style.top = (PH_Y - 40) + "px";
      var chipZoomX = ZX, chipZoomY = -(PH_H * (Z - 1) / 2);   // top edge moves up by (Z-1)/2 · H when zoomed

      // ── review card: popover beneath the ⋯ button (page scrolled to top in Scene 4) ──
      var review = el("review");
      var moreCx = CARD_X + (BOX.more[0] + BOX.more[2] / 2) * S;
      var moreBottom = CARD_Y + (BOX.more[1] + BOX.more[3]) * S;
      var REV_LEFT = 410;
      review.style.left = REV_LEFT + "px";
      review.style.top = (moreBottom + 22) + "px";
      el("review-notch").style.left = (moreCx - REV_LEFT - 9) + "px";

      // ── publish lift + burst + pill (world coords) ──
      var pub = { x: BOX.publish[0] * S, y: BOX.publish[1] * S, w: BOX.publish[2] * S, h: BOX.publish[3] * S };
      var lift = el("lift");
      lift.style.left = pub.x + "px"; lift.style.top = pub.y + "px";
      lift.style.width = pub.w + "px"; lift.style.height = pub.h + "px";
      el("lift-img").style.left = (-pub.x) + "px";
      el("lift-img").style.top = (-pub.y) + "px";
      var burst = el("burst");
      burst.style.left = pub.x + "px"; burst.style.top = pub.y + "px";
      burst.style.width = pub.w + "px"; burst.style.height = pub.h + "px";
      var pill = el("pill");
      pill.style.left = pub.x + "px";
      pill.style.top = (pub.y + pub.h + 14) + "px";

      var world = el("world"), card = el("card"), phone = el("phone");
      var W_SCROLL = -CROP_Y * S;
      var PUNCH = 1.6;

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.2s): screen card enters; headline at 0.3s ──
      tl.set(world, { x: 0, y: W_SCROLL, scale: 1 }, 0);
      tl.fromTo(card, { opacity: 0, y: 40, scale: 0.975 }, { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: "power3.out" }, 0);
      tl.fromTo(el("kicker"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      ["w1", "w2", "w3", "w4"].forEach(function (w, i) {
        tl.fromTo(el(w), { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.3 + i * 0.12);
      });

      // ── Scene 2 (1.2–3.2s): field rings on their words; the preview phone docks; arc field → preview line; the line answers ──
      var dashed = ["r1", "r1-glow", "r2", "r2-glow", "rc", "rc-glow", "rp", "rp-glow", "p1", "p1-glow", "p2", "p2-glow", "a1", "a1-halo", "a2", "a2-halo"];
      tl.set(dashed.map(el), { strokeDashoffset: 1 }, 0);
      tl.set([el("d1"), el("d2")], { opacity: 0 }, 0);

      function ring(name, at, dur) {
        dur = dur || 0.6;
        tl.fromTo(el(name), { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
        tl.fromTo(el(name + "-glow"), { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
      }
      function link(a, d, at) {
        tl.fromTo([el(a + "-halo"), el(a)], { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, at);
        tl.fromTo(el(d), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, at + 0.42);
      }

      // the live preview docks beside the form with the first edit (co-visible couple)
      tl.fromTo(phone, { x: -440, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 1.15);

      ring("r1", 1.2);
      link("a1", "d1", 1.45);
      ring("p1", 1.9, 0.45);

      tl.to([el("r1"), el("r1-glow")], { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 2.4);
      tl.to([el("a1"), el("a1-halo"), el("d1"), el("p1"), el("p1-glow")], { opacity: 0.4, duration: 0.4, ease: "power2.out" }, 2.4);
      ring("r2", 2.4);
      link("a2", "d2", 2.65);
      ring("p2", 3.1, 0.45);

      // ── Scene 3 (3.2–5.4s): zoom-to-target ≈1.25× on the preview phone; the form steps back but stays legible ──
      tl.to([el("a1"), el("a1-halo"), el("d1"), el("a2"), el("a2-halo"), el("d2")], { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.2);
      tl.to([el("p1"), el("p1-glow")], { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.2);
      tl.fromTo(phone, { scale: 1 }, { scale: Z, x: ZX, duration: 0.95, ease: "power3.inOut" }, 3.2);
      tl.fromTo(el("dim"), { opacity: 0 }, { opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 3.25);
      // feature chip pops at the phone's top edge at 3.8s
      tl.set(chipAnchor, { x: chipZoomX, y: chipZoomY }, 0);
      tl.fromTo(el("chip"), { scale: 0.6, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.8);
      [4.3, 5.0].forEach(function (t) {
        tl.fromTo(el("live-halo"), { scale: 1, opacity: 0.7 }, { scale: 2.6, opacity: 0, duration: 0.65, ease: "power2.out" }, t);
      });

      // ── Scene 4 (5.4–8.6s): zoom back; form scrolls to its top bar; ring on ⋯; review card; comments ──
      tl.to(phone, { scale: 1, x: 0, duration: 0.8, ease: "power3.inOut" }, 5.4);
      tl.to(chipAnchor, { x: 0, y: 0, duration: 0.8, ease: "power3.inOut" }, 5.4);
      tl.to(el("dim"), { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 5.4);
      tl.to([el("r1"), el("r1-glow"), el("r2"), el("r2-glow"), el("p1"), el("p1-glow"), el("p2"), el("p2-glow")], { opacity: 0, duration: 0.4, ease: "power2.out" }, 5.4);
      tl.to(world, { y: 0, duration: 0.8, ease: "power3.inOut" }, 5.45);

      ring("rc", 5.8);

      tl.fromTo(review, { opacity: 0, y: -16, clipPath: "inset(-20px 0px 100% 0px round 16px)" }, { opacity: 1, y: 0, clipPath: "inset(-20px 0px 0% 0px round 16px)", duration: 0.6, ease: "power3.out" }, 6.3);
      tl.fromTo(el("b1"), { opacity: 0, y: 12, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 6.8);
      tl.fromTo(el("b2"), { opacity: 0, y: 12, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 7.8);

      // ── Scene 5 (8.6–10.247s): card tucks away; punch-in on the top bar; press on publish; "פורסם" pops ──
      tl.to(review, { opacity: 0, y: -12, clipPath: "inset(-20px 0px 100% 0px round 16px)", duration: 0.45, ease: "power3.in" }, 8.6);
      tl.to([el("rc"), el("rc-glow")], { opacity: 0, duration: 0.35, ease: "power2.out" }, 8.65);
      tl.to(world, { scale: PUNCH, duration: 0.7, ease: "power3.inOut" }, 8.6);
      ring("rp", 8.9, 0.45);

      // press-release-spring (subtle variant): linear compression, spring release, burst behind
      var PRESS_START = 9.3, PRESS_DUR = 0.15, RELEASE_START = PRESS_START + PRESS_DUR;
      tl.fromTo(lift, { scale: 1, boxShadow: "0 0px 0px 0px rgba(28,25,23,0)" }, { scale: 1, boxShadow: "0 5px 12px -3px rgba(28,25,23,0.35)", duration: 0.35, ease: "power2.out" }, 8.95);
      tl.to(lift, { scale: 0.9, boxShadow: "0 1px 2px 0px rgba(28,25,23,0.25)", duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      tl.to(lift, { scale: 1, boxShadow: "0 5px 12px -3px rgba(28,25,23,0.35)", duration: 0.55, ease: "back.out(1.4)" }, RELEASE_START);
      tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 2.6, opacity: 0.55, duration: 0.4, ease: "power2.out" }, RELEASE_START);
      tl.to(burst, { opacity: 0, duration: 0.4, ease: "power2.in" }, RELEASE_START + 0.4);

      // state change at release: the check pill stamps in beneath the button, then holds
      tl.fromTo(pill, { scale: 0.5, opacity: 0, x: -6 }, { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)" }, RELEASE_START);

      // pin the timeline to the frame duration (hold)
      tl.set({}, {}, 10.247);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-edit"] = tl;
    })();
  </script>
</template>
