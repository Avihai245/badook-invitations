                <line x1="180" y1="180" x2="45.21" y2="150.40" stroke="#1C1917" stroke-opacity="0.22" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 4" />

                <!-- the needle: drawn at 0% (pointing right), rotated −(v / 130%) × 180° about the pivot -->
                <g id="11-budget-needle">

                <circle cx="180" cy="180" r="3.5" fill="#FFFFFF" />

              <!-- the percent, counting with the needle -->
              <div id="11-budget-pct"><span id="11-budget-pct-num">0</span><span>%</span></div>

              <!-- the status pill: changes text + color with the zone -->
              <div class="11-budget-pillbox" dir="rtl" lang="he">

                <div id="11-budget-zp-close" class="11-budget-zpill 11-budget-z-close">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
                  <span>מתקרבים לגבול</span>

    <div id="11-budget-top" class="clip" data-start="0" data-duration="14.516" data-track-index="3" dir="rtl" lang="he">
      <div id="11-budget-kicker">10 · תקציב</div>
      <h1 id="11-budget-head">
        <span class="11-budget-hl" id="11-budget-hl1">איפה אתם</span>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="11-budget"]') || document;
      function el(name) {
        return scope.querySelector('[id="11-budget-' + name + '"]') || document.getElementById("11-budget-" + name);
      }

      var tl = gsap.timeline({ paused: true });

      // ── gauge model (app: half circle to 130%, safe ≤ 85%, close 85–100%, over > 100%) ──
      function deg(pct) { return -(pct / 130) * 180; }   // needle rotation (screen CCW from the right)
      function off(pct) { return 130 - pct; }            // fill dash offset (pathLength 130)
      var needle = el("needle");
      var fills = scope.querySelectorAll('[class~="11-budget-fill"]');
      var pctNum = el("pct-num");   // the percent counts with the needle (snapped textContent tween: seek-safe, no callbacks)

      // one needle move = rotation + fill + percent on the SAME window and ease
      function swing(from, to, at, dur, ease, first) {
        var ir = !!first;
        tl.fromTo(needle, { rotation: deg(from), svgOrigin: "180 180" }, { rotation: deg(to), svgOrigin: "180 180", duration: dur, ease: ease, immediateRender: ir }, at);
        tl.fromTo(fills, { attr: { "stroke-dashoffset": off(from) } }, { attr: { "stroke-dashoffset": off(to) }, duration: dur, ease: ease, immediateRender: ir }, at);
        tl.fromTo(pctNum, { textContent: from }, { textContent: to, snap: { textContent: 1 }, duration: dur, ease: ease, immediateRender: ir }, at);
      }
      function fade(name, a, b, at, dur, ease, first) {
        tl.fromTo(el(name), { opacity: a }, { opacity: b, duration: dur, ease: ease || "power2.out", immediateRender: !!first }, at);
      }
      function pop(name, at, first) {
        tl.fromTo(el(name), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: !!first }, at);
      }

      // initial gauge state: 0%
      tl.set(needle, { rotation: 0, svgOrigin: "180 180" }, 0);
      tl.set(el("zp-safe"), { opacity: 0 }, 0);
      tl.set(el("zp-close"), { opacity: 0 }, 0);
      tl.set(el("zp-over"), { opacity: 0 }, 0);
      tl.set(el("zp-safe2"), { opacity: 0 }, 0);

      // ── Scene 1 (0.0–2.5s): the gauge card hero enters, zoomed; needle at 0%; kicker + headline on their words ──
      tl.fromTo(el("hero-in"), { opacity: 0, scale: 0.955, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo(el("kicker"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.35);
      tl.fromTo(el("hl1"), { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.84);   // "איפה אתם"
      tl.fromTo(el("hl2"), { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.5);    // "עומדים"

      // ── Scene 2 (2.5–3.5s): needle sweeps to 44%, percent counts with it ──
      tl.fromTo(el("fills"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 2.5);
      swing(0, 44.1, 2.5, 0.9, "power3.out", true);
      // "נשארו ₪55,900" belongs to 44%: hidden until the needle lands there
      fade("lineplate", 1, 0, 3.25, 0.3, "power2.out", true);

      // ── Scene 3 (3.5–5.4s): "ירוק, בטוחים" — green zone glows, pill pops ──
      fade("glow-safe", 0, 1, 3.6, 0.6, "power2.out", true);
      pop("zp-safe", 4.1, true);

      // ── Scene 4 (5.4–7.7s): "צהוב, מתקרבים לגבול" — swing into the amber zone ──
      fade("glow-safe", 1, 0, 5.4, 0.5, "power2.inOut");
      fade("lineplate", 0, 1, 5.4, 0.3, "power2.out");
      swing(44.1, 92, 5.4, 0.6, "power3.inOut");
      fade("fill-close", 0, 1, 5.76, 0.12, "none", true);
      fade("fill-safe", 1, 0, 5.8, 0.1, "none", true);
      fade("glow-close", 0, 1, 5.85, 0.55, "power2.out", true);
      fade("zp-safe", 1, 0, 6.2, 0.2, "power2.out");
      pop("zp-close", 6.2, true);

      // ── Scene 5 (7.7–9.7s): "אדום, חריגה" — past the red line, held, then back to 44% ──
      swing(92, 104, 7.7, 0.5, "power3.out");
      fade("fill-over", 0, 1, 7.83, 0.1, "none", true);
      fade("fill-close", 1, 0, 7.86, 0.08, "none");
      fade("glow-close", 1, 0, 7.85, 0.4, "power2.inOut");
      fade("glow-over", 0, 1, 7.85, 0.5, "power2.out", true);
      fade("zp-close", 1, 0, 8.4, 0.2, "power2.out");
      pop("zp-over", 8.4, true);
      // HOLD 8.6–9.35: nothing moves — the red needle sits past the line
      swing(104, 44.1, 9.35, 0.5, "power2.inOut");
      fade("glow-over", 1, 0, 9.35, 0.35, "power2.inOut");
      fade("fill-close", 0, 1, 9.42, 0.06, "none");
      fade("fill-over", 1, 0, 9.44, 0.06, "none");
      fade("fill-safe", 0, 1, 9.53, 0.06, "none");
      fade("fill-close", 1, 0, 9.55, 0.06, "none");
      fade("zp-over", 1, 0, 9.6, 0.2, "power2.out");
      pop("zp-safe2", 9.6, true);
      fade("lineplate", 1, 0, 9.6, 0.25, "power2.out");

      // ── Scene 6a (9.8–10.5s): zoom out — the hero card shrinks exactly onto the gauge card inside the
      // screen card while the rest of the page fades in around it (hero card 30,476 · 1020 wide ↔ page CSS
      // (17,323) in the card at crop y 200: 129.2,733.8 · 821.5 wide) ──
      var S = 900 / 390;
      var HX = 30, HY = 476, HW = 1020;
      var WX = 90 + 17 * S, WY = 450 + (323 - 200) * S, WW = 356 * S;
      var k1 = WW / HW;
      tl.fromTo(el("hero-cam"), { x: 0, y: 0, scale: 1 }, { x: WX - k1 * HX, y: WY - k1 * HY, scale: k1, duration: 0.7, ease: "power3.inOut" }, 9.8);
      fade("window", 0, 1, 9.85, 0.4, "power1.out", true);
      fade("hero", 1, 0, 10.42, 0.12, "none", true);

      // spotlight rings: ring draws on, glow + dim cut-out follow
      function ring(name, at) {
        tl.fromTo(el("r-" + name), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, at);
        tl.fromTo(el("rg-" + name), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at + 0.3);
        tl.fromTo(el("hole-" + name), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, at);
      }

      // the page's scroll positions (card-local px): crop y 200 (add + gauge), 2759 (payments), 935 (basis)
      var wscroll = el("wscroll");
      var Y0 = -200 * S, YPAY = -2759.3 * S, YBASIS = -935 * S, D = 240;

      // 10.3s "הוצאות" — add expense
      ring("add", 10.3);
      tl.fromTo(el("c-add"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 10.42);

      // ── Scene 6b (10.75s): cut-the-curve scroll down to payments (accelerate out → jump → decelerate in) ──
      tl.fromTo(el("hole-add"), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.in", immediateRender: false }, 10.75);
      tl.fromTo(wscroll, { y: Y0 }, { y: Y0 - D, duration: 0.18, ease: "power2.in" }, 10.75);
      tl.fromTo(wscroll, { y: YPAY + D }, { y: YPAY, duration: 0.3, ease: "power3.out", immediateRender: false }, 10.93);
      // "ותשלומים" — payments
      ring("pay", 11.08);
      tl.fromTo(el("c-pay"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 11.22);

      // ── Scene 6c (12.15s): cut-the-curve scroll back up to the guests basis ──
      tl.fromTo(el("hole-pay"), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.in", immediateRender: false }, 12.15);
      tl.fromTo(wscroll, { y: YPAY }, { y: YPAY + D, duration: 0.18, ease: "power2.in", immediateRender: false }, 12.15);
      tl.fromTo(wscroll, { y: YBASIS - D }, { y: YBASIS, duration: 0.3, ease: "power3.out", immediateRender: false }, 12.33);
      // "מה יקרה אם ישתנה מספר האורחים" — the guests basis + the what-if chip
      ring("basis", 12.5);
      tl.fromTo(el("chip"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 12.7);
      // 13.2s the what-if number ticks 240 → 260
      tl.fromTo(el("chip-num"), { textContent: 240 }, { textContent: 260, snap: { textContent: 1 }, duration: 0.7, ease: "power2.out" }, 13.2);

      // hold to the last frame
      tl.set({}, {}, 14.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["11-budget"] = tl;
    })();
  </script>
