          " H" + (x + r) + " A" + r + " " + r + " 0 0 1 " + x + " " + (y + h - r) +
          " V" + (y + r) + " A" + r + " " + r + " 0 0 1 " + (x + r) + " " + y + " Z";
      }

      // measured boxes (CSS px of the 390-wide page)
      var SEND = { x: LX(152), y: LY(299), w: 222 * S, h: 40 * S };            // לשלוח לאורחים את השולחן
      var FAM = { x: LX(306), y: LY(439) };                                     // "3 משפחות עוד בלי שולחן" line center
      var T1 = { x: LX(195.17), y: LY(771.33) };                                // table 1 center
      var CANVAS_TOP = LY(564);                                                 // `canvas` [17, 564, 356, 559]

      // zoom-to-target on the plan: 1.3×, centred on the canvas column, bottom held on the crop edge
      var ZS = 1.3;
      var ZX = 450 - LX(195) * ZS;                                              // canvas center x stays centred
      var ZY = CARD_H - CARD_H * ZS;                                            // never reveals the nav below the crop
      var PLAN_TOP = ZY + CANVAS_TOP * ZS;                                      // canvas top on the zoomed card

      // phone-table.png in the device screen: "2 · השולחן שלכם" card [16, 106, 357.67, 115.67]
      var PH = 420 / 390;
      var CARD = { x: 604 + 16 * PH, y: 626 + 106 * PH, w: 357.67 * PH, h: 115.67 * PH };

      // rings (paths computed from the boxes)
      var sendD = rr(SEND.x - 10, SEND.y - 10, SEND.w + 20, SEND.h + 20, 16);
      el("sendring").setAttribute("d", sendD);
      el("sendglow").setAttribute("d", sendD);
      var planD = rr(16, PLAN_TOP - 14, 868, CARD_H - 16 - (PLAN_TOP - 14), 16);
      el("planring").setAttribute("d", planD);
      el("planglow").setAttribute("d", planD);
      var cardD = rr(CARD.x - 8, CARD.y - 8, CARD.w + 16, CARD.h + 16, 30);
      el("cardring").setAttribute("d", cardD);
      el("cardglow").setAttribute("d", cardD);

      // drag geometry (card-space; world is at 1× during the drag): carrier origin = cursor tip, chip center = tip + (−44, +12)
      var CHIP_DX = -44, CHIP_DY = 12;
      var START = { x: 830, y: 760 };
      var GRAB = { x: FAM.x - 26 - CHIP_DX, y: FAM.y - CHIP_DY };   // chip lifts off the line, centred on it
      var DROP = { x: T1.x - CHIP_DX, y: T1.y - CHIP_DY };           // chip center lands exactly on table 1
      var REST = { x: 650, y: 980 };
      var CLICK = { x: SEND.x + SEND.w / 2, y: SEND.y + SEND.h / 2 };

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.9s): screen card enters, kicker, cursor arrives ──
      tl.fromTo(el("card"), { opacity: 0, y: 40, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" }, 0);
      tl.fromTo(el("kicker"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.35);

      tl.fromTo(el("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.1);
      tl.fromTo(el("carrier"), { x: START.x, y: START.y }, { x: GRAB.x, y: GRAB.y, duration: 0.7, ease: "power2.inOut" }, 1.12);

      // ── Scene 2 (1.9–4.4s): headline, grab → arc drag → drop on table 1 ──
      tl.fromTo(el("head"), { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: "power3.out" }, 1.9);

      // grab: press dip, chip lifts off the line, the line dims
      tl.fromTo(el("cursor"), { scale: 1 }, { scale: 0.86, duration: 0.08, ease: "power2.out" }, 1.9);
      tl.fromTo(el("cursor"), { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 1.98);
      tl.fromTo(el("chip"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1.05, duration: 0.24, ease: "power3.out" }, 1.92);
      tl.fromTo(el("famdim"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.95);

      // travel 2.2–3.4: carrier (cursor + chip, rigid) power3 in-out + a sideways arc on the lift wrapper
      tl.fromTo(el("carrier"), { x: GRAB.x, y: GRAB.y }, { x: DROP.x, y: DROP.y, duration: 1.2, ease: "power3.inOut", immediateRender: false }, 2.2);
      tl.fromTo(el("lift"), { x: 0, y: 0 }, { x: 96, y: -36, duration: 0.6, ease: "power2.out" }, 2.2);
      tl.fromTo(el("lift"), { x: 96, y: -36 }, { x: 0, y: 0, duration: 0.6, ease: "power2.in", immediateRender: false }, 2.8);

      // drop 3.4 — state commit: chip sinks into the table, the table answers
      tl.fromTo(el("cursor"), { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.out", immediateRender: false }, 3.4);
      tl.fromTo(el("cursor"), { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 3.47);
      tl.fromTo(el("chip"), { opacity: 1, scale: 1.05 }, { opacity: 0, scale: 0.3, duration: 0.2, ease: "power2.in", immediateRender: false }, 3.4);
      tl.fromTo(el("tpulse"), { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.3, duration: 0.7, ease: "power2.out", immediateRender: false }, 3.42);

      // the open seat fills, table label 6/14 → 9/14
      tl.set([el("chair"), el("lblpatch"), el("lbl")], { opacity: 1 }, 3.46);
      tl.fromTo(el("chair"), { scale: 0.55, backgroundColor: "#FFFFFF", borderColor: "#D6D3D1" },
        { scale: 1, backgroundColor: "#E9D7BF", borderColor: "#9F6F3E", duration: 0.28, ease: "power3.out", immediateRender: false }, 3.48);

      // seated count climbs 47 → 48 → 49 → 50 (one per family member)
      tl.set(el("statpatch"), { opacity: 1 }, 3.48);
      [["s48", 3.48, null], ["s49", 3.58, "s48"], ["s50", 3.68, "s49"]].forEach(function (s) {
        tl.set(el(s[0]), { opacity: 1 }, s[1]);
        if (s[2]) tl.set(el(s[2]), { opacity: 0 }, s[1]);
      });

      // the unseated line commits: dim lifts, 3 → 2 families; guests tab (3) → (2)
      tl.fromTo(el("famdim"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 3.5);
      tl.set([el("fampatch"), el("fam2")], { opacity: 1 }, 3.56);
      tl.set([el("tabpatch"), el("tab2")], { opacity: 1 }, 3.62);

      // cursor steps off the table so the result reads
      tl.fromTo(el("carrier"), { x: DROP.x, y: DROP.y }, { x: REST.x, y: REST.y, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 3.65);

      // callout pill on its word (spring-pop: smooth settle, no bounce)
      tl.fromTo(el("pill"), { opacity: 0, scale: 0.82, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.9);

      // ── Scene 3 (4.4–6.1s): zoom-to-target 1.3× on the hall plan + spotlight + ring ──
      tl.fromTo(el("world"), { x: 0, y: 0, scale: 1 }, { x: ZX, y: ZY, scale: ZS, duration: 1.0, ease: "power3.inOut" }, 4.4);
      tl.fromTo(el("dim"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.9);
      tl.set([el("planring"), el("planglow")], { opacity: 1 }, 5.0);
      tl.fromTo([el("planring"), el("planglow")], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 5.0);

      // ── Scene 4 (6.1–9.243s): zoom back, ring on send, click, phone arrives, ring on its table card ──
      tl.fromTo(el("world"), { x: ZX, y: ZY, scale: ZS }, { x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 6.1);
      tl.fromTo(el("dim"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.1);
      tl.fromTo([el("planring"), el("planglow")], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 6.1);
      tl.set([el("sendring"), el("sendglow")], { opacity: 1 }, 6.1);
      tl.fromTo([el("sendring"), el("sendglow")], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 6.1);

      tl.fromTo(el("carrier"), { x: REST.x, y: REST.y }, { x: CLICK.x, y: CLICK.y, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 6.05);
      tl.fromTo(el("cursor"), { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.out", immediateRender: false }, 6.58);
      tl.fromTo(el("cursor"), { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 6.65);
      tl.fromTo(el("ripple"), { opacity: 0.7, scale: 0.3 }, { opacity: 0, scale: 1.5, duration: 0.55, ease: "power2.out", immediateRender: false }, 6.58);

      tl.fromTo(el("phone"), { x: 640, opacity: 0 }, { x: 0, opacity: 1, duration: 0.85, ease: "power3.out" }, 6.7);
      tl.set([el("cardring"), el("cardglow")], { opacity: 1 }, 7.6);
      tl.fromTo([el("cardring"), el("cardglow")], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut" }, 7.6);

      // hold to the last frame
      tl.set({}, {}, 9.243);

      window.__timelines = window.__timelines || {};
      window.__timelines["12-seating"] = tl;
    })();
  </script>
</template>
