      var BOX = {
        yes: [203, 317, 171, 175],
        no: [203, 508, 171, 157],

      function scr(b, cy) {

      ["yes", "no", "pend"].forEach(function (k) {
        var d = rr(scr(BOX[k], CY_A), 12, 56);

        el("halo-" + k).setAttribute("d", d);
      });

      tl.fromTo(el("chip"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.0);
      tl.fromTo(el("dot-pulse"), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 3, duration: 1.0, ease: "power2.out", immediateRender: false }, 2.1);
      tl.fromTo(el("dot"), { scale: 1 }, { scale: 1.25, duration: 0.18, ease: "power2.out", immediateRender: false }, 2.1);
      tl.to(el("dot"), { scale: 1, duration: 0.5, ease: "power2.inOut" }, 2.28);

      // ── Scene 3 (3.1–7.5s): rings + count-ups on their words; slow camera push underneath ──
      tl.fromTo(el("cam"), { scale: 1 }, { scale: 1.03, duration: 4.4, ease: "power1.inOut" }, 3.1);
      function ring(k, at) {

        tl.fromTo(el("halo-" + k), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, at + 0.4);

      // 3.1s — r-yes: spotlight + ring, card number counts 0→24 (responses card ticks with it)
      tl.fromTo(el("spot-a"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.1);
      ring("yes", 3.1);
      count(el("n-yes"), 0, 24, 3.1, 1.3, true);
      count(el("n-total"), 0, 24, 3.1, 1.3, true);

      // 4.0s — pill "54 אנשים" on the same card
      tl.fromTo(el("lead-ppl"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.0);
      tl.fromTo(el("pill-ppl"), { opacity: 0, scale: 0.82, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.05);

      // 5.0s — r-no 0→3 (responses card 24→27)
      tl.to(el("spot-a"), Object.assign({ duration: 0.6, ease: "power3.inOut" }, spotBox("no")), 5.0);
      tl.to([el("ring-yes"), el("halo-yes"), el("lead-ppl")], { opacity: 0.3, duration: 0.5, ease: "power2.out" }, 5.0);
      tl.to(el("pill-ppl"), { opacity: 0.45, duration: 0.5, ease: "power2.out" }, 5.0);
      ring("no", 5.0);
      count(el("n-no"), 0, 3, 5.05, 0.7, true);
      count(el("n-total"), 24, 27, 5.05, 0.7, false);

      // 5.9s — r-pending 0→14
      tl.to(el("spot-a"), Object.assign({ duration: 0.6, ease: "power3.inOut" }, spotBox("pend")), 5.9);
      tl.to([el("ring-no"), el("halo-no")], { opacity: 0.3, duration: 0.5, ease: "power2.out" }, 5.9);
      ring("pend", 5.9);
      count(el("n-pend"), 0, 14, 5.95, 1.0, true);

      // ── Scene 4 (7.5–12.076s): cut-the-curve (upward, a scroll down the page) to the general-link banner ──
      // exit: view A + its annotations rip upward (power4.in), fade dies right at the hard cut
      tl.fromTo([el("pane-a"), el("annot-a")], { y: 0, filter: "blur(0px)" }, { y: -230, filter: "blur(18px)", duration: 0.3, ease: "power4.in" }, 7.5);
      tl.fromTo([el("pane-a"), el("annot-a")], { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in" }, 7.58);
      // entry: view B continues the same upward path (power4.out), matched blur at the cut
      tl.set(el("pane-b"), { y: 230, opacity: 0, filter: "blur(18px)" }, 0);
      tl.fromTo(el("pane-b"), { y: 230, opacity: 0.35, filter: "blur(18px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out", immediateRender: false }, 7.8);

      // banner ring + spotlight + pill
      tl.fromTo(el("spot-b"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.95);
      ring("gen", 7.95);
      tl.fromTo(el("lead-gen"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 8.35);
      tl.fromTo(el("pill-gen"), { opacity: 0, scale: 0.82, y: -10 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 8.4);

      // 9.6s — cursor-click-ripple: move → click (cursor + button depress together) → ripple
      tl.fromTo(el("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 9.45);
      tl.fromTo(el("cursor"), { x: 330, y: 260 }, { x: 0, y: 0, duration: 0.8, ease: "power2.inOut" }, 9.6);
      tl.to(el("cursor"), { scale: 0.85, duration: 0.08, ease: "power2.in" }, 10.55);
      tl.to(el("cursor"), { scale: 1, duration: 0.08, ease: "power2.out" }, 10.63);
      tl.to(el("btn"), { scale: 0.95, duration: 0.08, ease: "power2.in" }, 10.55);
      tl.to(el("btn"), { scale: 1, duration: 0.08, ease: "power2.out" }, 10.63);
      tl.fromTo([el("ripple-1"), el("ripple-2")], { scale: 0, opacity: 0.9 }, { scale: 3.4, opacity: 0, duration: 0.7, ease: "power2.out", stagger: 0.09, immediateRender: false }, 10.58);

      // 10.8s — brown check toast pops above the banner
      tl.fromTo(el("toast"), { opacity: 0, scale: 0.7, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 10.8);
      tl.fromTo(el("check-path"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 11.0);

      // hold to the last frame
      tl.set({}, {}, 12.076);

      window.__timelines = window.__timelines || {};
      window.__timelines["09-rsvp"] = tl;
    })();
