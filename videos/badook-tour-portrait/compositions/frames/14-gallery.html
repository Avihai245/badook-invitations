      var path = { p: 0 };

      function applyFly() {

        var bx = u * u * P0.x + 2 * u * t * P1.x + t * t * P2.x;
        var by = u * u * P0.y + 2 * u * t * P1.y + t * t * P2.y;

      tl.fromTo(el("chip"), { opacity: 0, scale: 0.6, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 6.4);
