      var CAM = {
        top: aimAt(195, 620, 1),              // hero + countdown, CSS y ≈ 380–860
        countdown: aim(BOX.countdown, 1.5),
        next: aim(BOX.next, 1),
        budget: aim(BOX.budget, 1),
        rsvp: aim(BOX.rsvp, 1),
        tasks: aim(BOX.tasks, 1),
        road: aimAt(195, 1965, 1)             // road map grid, CSS y ≈ 1725–2205
      };
      function toScreen(b, cam) {
        var c = content(b);
        return {
          x: CARD.x + C.x + cam.S * (c.x - cam.vx),
          y: CARD.y + C.y + cam.S * (c.y - cam.vy),
          w: c.w * cam.S,
          h: c.h * cam.S
        };
      }
      function rrPath(x, y, w, h, r) {
        return "M" + (x + w / 2) + " " + y +
          " H" + (x + w - r) + " A" + r + " " + r + " 0 0 1 " + (x + w) + " " + (y + r) +
          " V" + (y + h - r) + " A" + r + " " + r + " 0 0 1 " + (x + w - r) + " " + (y + h) +
          " H" + (x + r) + " A" + r + " " + r + " 0 0 1 " + x + " " + (y + h - r) +
          " V" + (y + r) + " A" + r + " " + r + " 0 0 1 " + (x + r) + " " + y +
          " H" + (x + w / 2);
      }

      // tab-bar band patches: data-patch = "x, yTop, w, srcY, srcH" (CSS px); a clean srcH-tall row is stretched over yTop→srcY
      Array.prototype.forEach.call(document.querySelectorAll('[class~="03-home-patch"]'), function (el) {
        var p = el.getAttribute("data-patch").split(",").map(Number);
        var x = p[0], yTop = p[1], w = p[2], srcY = p[3], srcH = p[4];
        el.style.left = (x * SC) + "px";
        el.style.top = (yTop * SC) + "px";
        el.style.width = (w * SC) + "px";
        el.style.height = (srcH * SC) + "px";
        el.style.transform = "scaleY(" + ((srcY + srcH - yTop) / srcH) + ")";
        var img = el.querySelector("img");
        img.style.left = (-x * SC) + "px";
        img.style.top = (-srcY * SC) + "px";
      });

      // rings: 4px line, radius 16, 8px soft halo — in world units for the camera scale they are shown at
      var RING = {
        countdown: { cam: CAM.countdown, pad: 12 },
        next: { cam: CAM.next, pad: 10 },
        budget: { cam: CAM.budget, pad: 10 },
        rsvp: { cam: CAM.rsvp, pad: 10 },
        tasks: { cam: CAM.tasks, pad: 10 },
        plan: { cam: CAM.road, pad: 9 },
        invite: { cam: CAM.road, pad: 9 },
        arrange: { cam: CAM.road, pad: 9 },
        celebrate: { cam: CAM.road, pad: 9 }
      };
      Object.keys(RING).forEach(function (k) {
        var c = content(BOX[k]), S = RING[k].cam.S, p = RING[k].pad / S, r = 16 / S, g = 6 / S;
        var gEl = $("ring-" + k);
        var glow = gEl.querySelector('[class~="03-home-ring-glow"]');
        var line = gEl.querySelector('[class~="03-home-ring-line"]');
        line.setAttribute("d", rrPath(c.x - p, c.y - p, c.w + 2 * p, c.h + 2 * p, r));
        line.setAttribute("stroke-width", String(4 / S));
        glow.setAttribute("d", rrPath(c.x - p - g, c.y - p - g, c.w + 2 * (p + g), c.h + 2 * (p + g), r + g));
        glow.setAttribute("stroke-width", String(8 / S));
      });
      ["countdown", "next", "budget", "rsvp", "tasks"].forEach(function (k) {
        var el = $("spot-" + k), c = content(BOX[k]), S = RING[k].cam.S, p = RING[k].pad / S;
        el.style.left = (c.x - p) + "px";
        el.style.top = (c.y - p) + "px";
        el.style.width = (c.w + 2 * p) + "px";
        el.style.height = (c.h + 2 * p) + "px";
        el.style.borderRadius = (16 / S) + "px";
      });

      // road-map cards: slot + real crop of the card (lifts 6 screen px)
      var CARD_R = 14 * SC;
      Array.prototype.forEach.call(document.querySelectorAll('[class~="03-home-slot"], [class~="03-home-lift"]'), function (el) {
        var c = content(BOX[el.getAttribute("data-card")]);
        el.style.left = c.x + "px";
        el.style.top = c.y + "px";
        el.style.width = c.w + "px";
        el.style.height = c.h + "px";
        el.style.borderRadius = CARD_R + "px";
        var img = el.querySelector("img");
        if (img) { img.style.left = (-c.x) + "px"; img.style.top = (-c.y) + "px"; }
      });

      // callout pills + leaders (canvas px, at each beat's settled camera)
      var PILL_H = 70;
      function placeCallout(k, side, fx, len) {
        var s = toScreen(BOX[k], RING[k].cam), pad = RING[k].pad + 2;
        var ax = s.x + s.w * fx;
        var leader = $("leader-" + k), anchor = $("anchor-" + k), pill = $("pill-" + k);
        leader.style.left = (ax - 1) + "px";
        leader.style.height = len + "px";
        anchor.style.left = (ax - 450) + "px";
        if (side === "below") {
          var yb = s.y + s.h + pad;
          leader.style.top = yb + "px";
          leader.style.transformOrigin = "50% 0%";
          anchor.style.top = (yb + len) + "px";
          pill.style.transformOrigin = "50% 0%";
        } else {
          var yt = s.y - pad;
          leader.style.top = (yt - len) + "px";
          leader.style.transformOrigin = "50% 100%";
          anchor.style.top = (yt - len - PILL_H) + "px";
          pill.style.transformOrigin = "50% 100%";
        }
      }
      placeCallout("countdown", "below", 0.5, 34);
      placeCallout("next", "below", 0.5, 30);
      placeCallout("budget", "above", 0.5, 26);
      placeCallout("rsvp", "above", 0.5, 26);
      placeCallout("tasks", "above", 0.5, 26);

      // ---------- timeline ----------
      var tl = gsap.timeline({ paused: true });
      var outer = $("zoom-outer"), world = $("world");
      gsap.set(outer, { scale: CAM.top.S, transformOrigin: "50% 50%" });
      gsap.set(world, { x: C.x - CAM.top.vx, y: C.y - CAM.top.vy });

      function camTo(cam, at, dur, ease) {
        // coordinate-target-zoom: outer scales about the card center, inner counter-translates (T = C − visible center)
        tl.to(outer, { scale: cam.S, duration: dur, ease: ease }, at);
        tl.to(world, { x: C.x - cam.vx, y: C.y - cam.vy, duration: dur, ease: ease }, at);
      }
      function ringIn(k, at, dur) {
        var g = $("ring-" + k);
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, at);
        tl.fromTo(g.querySelectorAll("path"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      }
      function spotIn(k, at) {
        tl.fromTo($("spot-" + k), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, at);
      }
      function calloutIn(k, side, at) {
        tl.fromTo($("leader-" + k), { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: "power2.out" }, at);
        tl.fromTo($("pill-" + k),
          { scale: 0.4, opacity: 0, y: side === "below" ? -12 : 12 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.08);
      }
      function countUp(k, to, at, dur) {
        var el = $("num-" + k), o = { v: 0 };
        tl.fromTo(o, { v: 0 }, {
          v: to, duration: dur, ease: "power3.out",
          onUpdate: function () { el.textContent = String(Math.round(o.v)); }
        }, at);
      }
      function handOff(els, at) {
        tl.to(els, { opacity: 0, duration: 0.2, ease: "power1.in" }, at);
      }
      function beatOff(k, at) {
        handOff([$("ring-" + k), $("spot-" + k), $("leader-" + k), $("pill-" + k)], at);
      }

      // Scene 1 (0.0–3.2): screen card rises + fades in; kicker; headline per-word on "במבט אחד"
      tl.fromTo($("card"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 0);
      tl.fromTo($("kicker"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo($("w1"), { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.6);
      tl.fromTo($("w2"), { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.0);
      tl.fromTo($("w3"), { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.22);
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 2.55);

      // Scene 2 (3.2–4.5): zoom 1.5× on the countdown tile, ring + pill "256 ימים" counting up
      camTo(CAM.countdown, 3.05, 0.9, "power3.inOut");
      spotIn("countdown", 3.4);
      ringIn("countdown", 3.4, 0.6);
      calloutIn("countdown", "below", 3.88);
      countUp("countdown", 256, 3.96, 0.56);
      beatOff("countdown", 4.52);

      // Scene 3 (4.5–6.9): glide out and down to the next-step card, ring + pill
      camTo(CAM.next, 4.6, 1.05, "power3.inOut");
      spotIn("next", 5.2);
      ringIn("next", 5.2, 0.75);
      calloutIn("next", "below", 5.72);
      beatOff("next", 6.5);

      // Scene 4 (6.9–10.6): the widgets, one at a time on their words (page order: rsvp, budget, tasks)
      camTo(CAM.budget, 6.6, 0.85, "power3.inOut");
      ringIn("budget", 6.9, 0.6);
      spotIn("budget", 6.95);
      calloutIn("budget", "above", 7.46);
      countUp("budget", 44, 7.54, 0.6);
      beatOff("budget", 7.92);

      camTo(CAM.rsvp, 7.92, 0.72, "power3.inOut");
      ringIn("rsvp", 8.1, 0.6);
      spotIn("rsvp", 8.15);
      calloutIn("rsvp", "above", 8.62);
      countUp("rsvp", 24, 8.7, 0.6);
      beatOff("rsvp", 9.02);

      camTo(CAM.tasks, 9.02, 0.78, "power3.inOut");
      ringIn("tasks", 9.2, 0.6);
      spotIn("tasks", 9.25);
      calloutIn("tasks", "above", 9.78);
      countUp("tasks", 72, 9.86, 0.6);
      beatOff("tasks", 10.42);

      // Scene 5 (10.6–16.932): page travels down to the road map, then the four stages light up in order
      camTo(CAM.road, 10.6, 1.0, "power3.inOut");
      var LIFT = -6 / CAM.road.S; // 6 screen px
      var STAGES = [
        { k: "plan", at: 13.0 },
        { k: "invite", at: 13.9 },
        { k: "arrange", at: 15.0 },
        { k: "celebrate", at: 15.7 }
      ];
      STAGES.forEach(function (st, i) {
        var k = st.k, at = st.at, n = i + 1;
        if (i > 0) handOff([$("ring-" + STAGES[i - 1].k)], at);
        ringIn(k, at, 0.55);
        tl.fromTo($("ring-" + k), { y: 0 }, { y: LIFT, duration: 0.55, ease: "power3.out" }, at);
        tl.fromTo($("lift-" + k), { y: 0 }, { y: LIFT, duration: 0.55, ease: "power3.out" }, at);
        tl.fromTo($("liftshadow-" + k), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, at);
        // top block: the 1-2-3-4 pill row assembles in sync
        if (n > 1) tl.fromTo($("link-" + n), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at - 0.08);
        tl.fromTo($("stagepill-" + n), { scale: 0.6, opacity: 0, y: 14 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.04);
      });
      // held read from ~15.9s to the end (no exit tweens: the root handles the frame change)

      window.__timelines = window.__timelines || {};
      window.__timelines["03-home"] = tl;
    })();
  </script>
</template>
