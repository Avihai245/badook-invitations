<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FBF7F1;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.306"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-intro"
        class="scene"
        data-composition-id="01-intro"
        data-composition-src="compositions/frames/01-intro.html"
        data-start="0"
        data-duration="10.306"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-intro-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="10.306"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <video id="01-intro-invite" src="assets/invite-open.mp4" muted playsinline
        class="clip"
        style="position:absolute;left:370px;top:50px;width:380px;height:822px;object-fit:cover"
        data-start="0"
        data-duration="10.306"
        data-track-index="1003"
      ></video>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="10.306"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
