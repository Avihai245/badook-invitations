  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="15-film"]') || document;
      function el(name) {
        return scope.querySelector('[id="15-film-' + name + '"]') || document.getElementById("15-film-" + name);
      }

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.9s): kicker; the player frame fades in on "האירוע" (0.9s) ──
      tl.fromTo(el("kicker"), { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0);
      // the film group holds CENTER (x +490, scale 1.06 — the fromTo at 4.0s pre-renders that state) until the insights take the weight
      tl.fromTo(el("player"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.15);

      // ── Scene 2 (1.9–4.0s): "סרט רגעים" — the film plays ──
      // play-glyph pill pops (smooth settle, no overshoot)
      tl.fromTo(el("pill"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.9);
      tl.fromTo(el("play"), { rotation: -12 }, { rotation: 0, duration: 0.55, ease: "power3.out" }, 1.95);
      // playback progress runs from the press to the frame end (RTL: fills from the right)
      tl.fromTo(el("progress-fill"), { scaleX: 0 }, { scaleX: 1, duration: 4.544, ease: "none" }, 1.9);
      // Ken Burns per shot (finite) + crossfades at 2.6s and 3.3s
      tl.fromTo(el("img-couple"), { scale: 1 }, { scale: 1.07, duration: 1.3, ease: "none" }, 1.9);
      tl.fromTo(el("shot-chuppah"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2.6);
      tl.fromTo(el("img-chuppah"), { scale: 1.02 }, { scale: 1.08, duration: 1.3, ease: "none" }, 2.6);
      tl.fromTo(el("shot-venue"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.3);
      tl.fromTo(el("img-venue"), { scale: 1.02, x: 0 }, { scale: 1.08, x: -14, duration: 3.144, ease: "none" }, 3.3);
      // the real film page (the chosen photos the film is made from) rises in under the player
      tl.fromTo(el("strip"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.35);

      // ── Scene 3 (4.0–6.444s): "ותובנות" — weight transfer: the film slides aside, the insights window takes the space ──
      tl.fromTo(el("group"), { x: 490, scale: 1.06 }, { x: 0, scale: 1, duration: 0.95, ease: "power3.out" }, 4.0);
      tl.fromTo(el("insights"), { opacity: 0, x: 140, scale: 0.97 }, { opacity: 1, x: 0, scale: 1, duration: 0.85, ease: "power3.out" }, 4.06);

      // count-up 0→209 on "הצפיות" (4.9s) — proxy value, text only (no size growth)
      var visits = el("num-visits");
      var vState = { v: 0 };
      tl.fromTo(vState, { v: 0 }, {
        v: 209, duration: 0.9, ease: "power2.out",
        onUpdate: function () { visits.textContent = String(Math.round(vState.v)); }
      }, 4.9);
      tl.fromTo(el("ring-visits"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 4.9);
      tl.fromTo(el("halo-visits"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 5.15);

      // count-up 0→188 on "וההגעה" (5.5s)
      var opens = el("num-opens");
      var oState = { v: 0 };
      tl.fromTo(oState, { v: 0 }, {
        v: 188, duration: 0.8, ease: "power2.out",
        onUpdate: function () { opens.textContent = String(Math.round(oState.v)); }
      }, 5.5);
      tl.fromTo(el("ring-opens"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 5.5);
      tl.fromTo(el("halo-opens"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 5.72);

      // hold to the last frame
      tl.set({}, {}, 6.44);

      window.__timelines = window.__timelines || {};
      window.__timelines["15-film"] = tl;
    })();
