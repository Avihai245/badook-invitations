    (function () {
      var scope = document.querySelector('[data-composition-id="06-edit"]') || document;

      // ── coordinate mapping: page 1440×900 CSS px → window 1180×737.5 (origin = window top-left) ──
      var S = 1180 / 1440; // 0.81944 px per CSS px

      var BOX = {

        return { x: b[0] * S - pad, y: b[1] * S - pad, w: b[2] * S + 2 * pad, h: b[3] * S + 2 * pad };
      }
      function rr(r, rad) {
        var x = r.x, y = r.y, w = r.w, h = r.h, cx = x + w / 2;
        rad = Math.min(rad, w / 2, h / 2);
        return "M" + cx + " " + y +
          " H" + (x + w - rad) + " A" + rad + " " + rad + " 0 0 1 " + (x + w) + " " + (y + rad) +
          " V" + (y + h - rad) + " A" + rad + " " + rad + " 0 0 1 " + (x + w - rad) + " " + (y + h) +
          " H" + (x + rad) + " A" + rad + " " + rad + " 0 0 1 " + x + " " + (y + h - rad) +
          " V" + (y + rad) + " A" + rad + " " + rad + " 0 0 1 " + (x + rad) + " " + y +

      var phone = loc(BOX.phone, 0);

      // rings (radius 14; small buttons 10)
      setD("r1", rr(fo, 14)); setD("r1-glow", rr(fo, 14));

      tl.fromTo(el("kicker"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.15);

      tl.fromTo(el("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.75);
      tl.fromTo(el("rule-accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.95);

      // ── Scene 2 (1.2–3.2s): rings on the fields; hairline arc field → phone; the phone answers ──
      function ring(name, at) {
        tl.fromTo(el(name), { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, at);
        tl.fromTo(el(name + "-glow"), { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, at);
      }
      function link(a, d, at) {
        tl.fromTo(el(a), { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, at);
        tl.fromTo(el(d), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, at + 0.42);
      }
      function answer(at, from) {
        // the bound surface lights up on arrival of the link (same beat as the edit)
        tl.fromTo([el("phone-ring"), el("phone-glow")], { opacity: from }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
        tl.to([el("phone-ring"), el("phone-glow")], { opacity: 0.45, duration: 0.6, ease: "power2.inOut" }, at + 0.3);
      }
      tl.set([el("r1"), el("r1-glow"), el("r2"), el("r2-glow"), el("rc"), el("rc-glow"), el("rp"), el("rp-glow"), el("a1"), el("a2")], { strokeDashoffset: 1 }, 0);

      ring("r1", 1.2);
      link("a1", "d1", 1.45);
      answer(1.9, 0);

      tl.to([el("r1"), el("r1-glow"), el("a1"), el("d1")], { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 2.4);
      ring("r2", 2.4);
      link("a2", "d2", 2.65);
      answer(3.1, 0.45);

      // ── Scene 3 (3.2–5.4s): zoom-to-target ≈1.25× on the phone (fields stay co-visible) ──
      tl.fromTo(el("world"), { x: 0, y: 0, scale: 1 }, { x: zx, y: zy, scale: Z, duration: 0.95, ease: "power3.inOut" }, 3.2);
      // feature chip pops at the phone's top edge at 3.8s
      tl.fromTo(el("chip"), { scale: 0.6, opacity: 0, y: 10 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.8);
      // live dot: two finite, explicitly placed pulses
      [4.3, 5.0].forEach(function (t) {
        tl.fromTo(el("live-halo"), { scale: 1, opacity: 0.7 }, { scale: 2.6, opacity: 0, duration: 0.65, ease: "power2.out" }, t);
      });

      // ── Scene 4 (5.4–8.6s): zoom back; ring on הערות; review card slides out; comments arrive ──
      tl.to(el("world"), { x: 0, y: 0, scale: 1, duration: 0.8, ease: "power3.inOut" }, 5.4);
      tl.to([el("r1"), el("r1-glow"), el("a1"), el("d1"), el("r2"), el("r2-glow"), el("a2"), el("d2"), el("phone-ring"), el("phone-glow")], { opacity: 0, duration: 0.5, ease: "power2.out" }, 5.45);

      ring("rc", 5.8);

      tl.fromTo(card, { opacity: 0, y: -14, clipPath: "inset(0% 0% 100% 0% round 12px)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0% round 12px)", duration: 0.6, ease: "power3.out" }, 6.3);
      tl.fromTo(el("b1"), { opacity: 0, y: 10, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 6.8);
      tl.fromTo(el("b2"), { opacity: 0, y: 10, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 7.8);

      // ── Scene 5 (8.6–10.247s): card tucks away; press on פרסום השינויים; "פורסם" pops ──
      tl.to(card, { opacity: 0, y: -10, clipPath: "inset(0% 0% 100% 0% round 12px)", duration: 0.45, ease: "power3.in" }, 8.6);
      tl.to([el("rc"), el("rc-glow")], { opacity: 0, duration: 0.35, ease: "power2.out" }, 8.65);
      ring("rp", 8.9);

      // press-release-spring (subtle variant): linear-ish compression, spring release, burst behind
      var PRESS_START = 9.3, PRESS_DUR = 0.15, RELEASE_START = PRESS_START + PRESS_DUR;
      // the real button lifts off the page as its ring draws (rest shadow: large + diffuse)
      tl.fromTo(lift, { scale: 1, boxShadow: "0 0px 0px 0px rgba(28,25,23,0)" }, { scale: 1, boxShadow: "0 6px 16px -4px rgba(28,25,23,0.35)", duration: 0.4, ease: "power2.out" }, 8.9);
      tl.to(lift, { scale: 0.9, boxShadow: "0 1px 2px 0px rgba(28,25,23,0.25)", duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      tl.to(lift, { scale: 1, boxShadow: "0 6px 16px -4px rgba(28,25,23,0.35)", duration: 0.55, ease: "back.out(1.4)" }, RELEASE_START);
      tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 3, opacity: 0.55, duration: 0.4, ease: "power2.out" }, RELEASE_START);
      tl.to(burst, { opacity: 0, duration: 0.4, ease: "power2.in" }, RELEASE_START + 0.4);

      // state change at release: the check pill stamps in beside the button, then holds
      tl.fromTo(pill, { scale: 0.5, opacity: 0, x: -8 }, { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)" }, RELEASE_START);

      // pin the timeline to the frame duration (hold)
      tl.set({}, {}, 10.247);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-edit"] = tl;
    })();
  </script>
