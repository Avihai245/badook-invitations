    (function () {
      var scope = document.querySelector('[data-composition-id="04-design"]') || document;

      // crop scale: 1150 px displayed / 1128 CSS px cropped

      var SCROLL_FROM = -380 * S;  // page CSS y ≈ 380 at the window top

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–2.1s): tilted window enters from below; kicker reveal ──

        el("window"),
        { transformPerspective: 1800, rotationX: 8, rotationY: -6, transformOrigin: "50% 50%", y: 320, opacity: 0 },
        { transformPerspective: 1800, rotationX: 8, rotationY: -6, transformOrigin: "50% 50%", y: 0, opacity: 1, duration: 1.15, ease: "power3.out" },
        0
      );
      // kicker — clip-path wipe from the reading edge (right) + hairline rule draws on
      tl.fromTo(
        el("kicker"),
        { opacity: 0, clipPath: "inset(0% 0% 0% 100%)" },
        { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" },
        0.45
      );
      tl.fromTo(el("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.6);

      // ── Scene 2 (2.1–4.0s): on "משישים" the number counts 0→60, "+" pops at 2.6s; page scrolls ──

      var counter = { v: 0 };
      tl.fromTo(el("num"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.1);
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 60,
          duration: 0.5,
          ease: "power2.out",
          onUpdate: function () {
            digits.textContent = String(Math.round(counter.v));
          }
        },
        2.1
      );
      tl.fromTo(el("plus"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 2.6);

      // 3d-page-scroll: one finite power3 travel CSS y 380 → 1700, rows of cards pass (2.1–6.6s);
      // fromTo renders the from-state immediately, so the page is parked at CSS y ≈ 380 before 2.1s

      // "עיצובים מונפשים" — per-word rise (RTL: first word first)
