      // ring geometry in world units so it reads 3px / radius 14 / 6px halo on screen at the camera scale it's shown at
      var RING = {
        countdown: { cam: CAM.countdown, pad: 10 },
        next: { cam: CAM.next, pad: 10 },
        budget: { cam: CAM.top, pad: 9 },
        rsvp: { cam: CAM.top, pad: 9 },
        tasks: { cam: CAM.top, pad: 9 },
        plan: { cam: CAM.road, pad: 8 },
        invite: { cam: CAM.road, pad: 8 },
        arrange: { cam: CAM.road, pad: 8 },
        celebrate: { cam: CAM.road, pad: 8 }
      };
      Object.keys(RING).forEach(function (k) {
        var c = content(BOX[k]), S = RING[k].cam.S, p = RING[k].pad / S, r = 14 / S, g = 4.5 / S;
        var gEl = $("ring-" + k);
        var glow = gEl.querySelector('[class~="03-home-ring-glow"]');
        var line = gEl.querySelector('[class~="03-home-ring-line"]');
        line.setAttribute("d", rrPath(c.x - p, c.y - p, c.w + 2 * p, c.h + 2 * p, r));
        line.setAttribute("stroke-width", String(3 / S));
        glow.setAttribute("d", rrPath(c.x - p - g, c.y - p - g, c.w + 2 * (p + g), c.h + 2 * (p + g), r + g));
        glow.setAttribute("stroke-width", String(6 / S));
      });
      // spotlights (hole = box + ring pad, radius 14 on screen)
      function placeSpot(el, k) {
        var c = content(BOX[k]), S = RING[k].cam.S, p = RING[k].pad / S;
        el.style.left = (c.x - p) + "px";
        el.style.top = (c.y - p) + "px";
        el.style.width = (c.w + 2 * p) + "px";
        el.style.height = (c.h + 2 * p) + "px";
        el.style.borderRadius = (14 / S) + "px";
      }
      placeSpot($("spot-countdown"), "countdown");
      placeSpot($("spot-next"), "next");
      placeSpot($("spot-widget"), "budget");
      var SPOT_DX_RSVP = (BOX.rsvp[0] - BOX.budget[0]) * SC;
      var SPOT_DX_TASKS = (BOX.tasks[0] - BOX.budget[0]) * SC;

      // road-map cards: slot + real crop of the card (lifts 6 screen px at 1.2×)
      var CARD_R = 20 * SC;
      Array.prototype.forEach.call(document.querySelectorAll('[class~="03-home-slot"], [class~="03-home-lift"]'), function (el) {
        var c = content(BOX[el.getAttribute("data-card")]);
        el.style.left = c.x + "px";
        el.style.top = c.y + "px";
        el.style.width = c.w + "px";
        el.style.height = c.h + "px";
        el.style.borderRadius = CARD_R + "px";
        var img = el.querySelector("img");
        if (img) { img.style.left = (-c.x) + "px"; img.style.top = (-c.y) + "px"; }
      });

      // callout pills + leaders (canvas px, computed at the settled camera of each beat)
      var PILL_H = 56;
      function placeCallout(k, side, fx, len) {
        var s = toScreen(BOX[k], RING[k].cam), pad = RING[k].pad + 1.5;
        var ax = s.x + s.w * fx;
        var leader = $("leader-" + k), anchor = $("anchor-" + k), pill = $("pill-" + k);
        leader.style.left = (ax - 0.75) + "px";
        leader.style.height = len + "px";
        anchor.style.left = (ax - 400) + "px";
        if (side === "below") {
          var yb = s.y + s.h + pad;
          leader.style.top = yb + "px";
          leader.style.transformOrigin = "50% 0%";
          anchor.style.top = (yb + len) + "px";
          pill.style.transformOrigin = "50% 0%";
        } else {
          var yt = s.y - pad;
          leader.style.top = (yt - len) + "px";
          leader.style.transformOrigin = "50% 100%";
          anchor.style.top = (yt - len - PILL_H) + "px";
          pill.style.transformOrigin = "50% 100%";
        }
      }
      placeCallout("countdown", "below", 0.5, 30);
      placeCallout("next", "below", 0.72, 32);
      placeCallout("budget", "above", 0.5, 18);
      placeCallout("rsvp", "above", 0.5, 18);
      placeCallout("tasks", "above", 0.5, 18);

      // ---------- timeline ----------
      var tl = gsap.timeline({ paused: true });
      var outer = $("zoom-outer"), world = $("world");
      gsap.set(outer, { scale: 1, transformOrigin: "50% 50%" });
      gsap.set(world, { x: 0, y: 0 });

      function camTo(cam, at, dur, ease) {
        // coordinate-target-zoom: outer scales about the window center, inner counter-translates (T = C − visible center)
        tl.to(outer, { scale: cam.S, duration: dur, ease: ease }, at);
        tl.to(world, { x: C.x - cam.vx, y: C.y - cam.vy, duration: dur, ease: ease }, at);
      }
      function ringIn(k, at, dur) {
        var g = $("ring-" + k);
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, at);
        tl.fromTo(g.querySelectorAll("path"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      }
      function calloutIn(k, side, at) {
        tl.fromTo($("leader-" + k), { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: "power2.out" }, at);
        tl.fromTo($("pill-" + k),
          { scale: 0, opacity: 0, y: side === "below" ? -10 : 10 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.08);
      }
      function countUp(k, to, at, dur) {
        var el = $("num-" + k), o = { v: 0 };
        tl.fromTo(o, { v: 0 }, {
          v: to, duration: dur, ease: "power3.out",
          onUpdate: function () { el.textContent = String(Math.round(o.v)); }
        }, at);
      }
      function handOff(els, at) {
        tl.to(els, { opacity: 0, duration: 0.2, ease: "power1.in" }, at);
      }

      // Scene 1 (0.0–3.2): window rises + fades in; kicker; headline per-word on "במבט אחד"
      tl.fromTo($("window"), { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 0);
      tl.fromTo($("kicker"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo($("w1"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.6);
      tl.fromTo($("w2"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.0);
      tl.fromTo($("w3"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.22);
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 2.55);

      // Scene 2 (3.2–4.5): zoom ≈1.5× on the countdown, ring + pill "256 ימים" counting up
      camTo(CAM.countdown, 3.05, 0.9, "power3.inOut");
      tl.fromTo($("spot-countdown"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 3.4);
      ringIn("countdown", 3.4, 0.6);
      calloutIn("countdown", "below", 3.88);
      countUp("countdown", 256, 3.96, 0.56);
      handOff([$("ring-countdown"), $("spot-countdown"), $("leader-countdown"), $("pill-countdown")], 4.52);

      // Scene 3 (4.5–6.9): glide to the next-step card (≈1.15×), ring + pill
      camTo(CAM.next, 4.6, 1.05, "power3.inOut");
      tl.fromTo($("spot-next"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 5.2);
      ringIn("next", 5.2, 0.75);
      calloutIn("next", "below", 5.72);
      handOff([$("ring-next"), $("spot-next"), $("leader-next"), $("pill-next")], 6.72);

      // Scene 4 (6.9–10.6): back to 1.0 over the three widgets; one ring at a time on its word
      camTo(CAM.top, 6.8, 0.8, "power3.inOut");
      tl.fromTo($("spot-widget"), { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 6.95);
      ringIn("budget", 6.9, 0.6);
      calloutIn("budget", "above", 7.54);
      countUp("budget", 44, 7.62, 0.6);

      handOff([$("ring-budget"), $("leader-budget"), $("pill-budget")], 8.02);
      tl.to($("spot-widget"), { x: SPOT_DX_RSVP, duration: 0.42, ease: "power3.inOut" }, 8.02);
      ringIn("rsvp", 8.1, 0.6);
      calloutIn("rsvp", "above", 8.46);
      countUp("rsvp", 24, 8.54, 0.6);

      handOff([$("ring-rsvp"), $("leader-rsvp"), $("pill-rsvp")], 9.12);
      tl.to($("spot-widget"), { x: SPOT_DX_TASKS, duration: 0.45, ease: "power3.inOut" }, 9.12);
      ringIn("tasks", 9.2, 0.6);
      calloutIn("tasks", "above", 9.56);
      countUp("tasks", 72, 9.64, 0.6);
      handOff([$("ring-tasks"), $("spot-widget"), $("leader-tasks"), $("pill-tasks")], 10.42);

      // Scene 5 (10.6–16.932): page travels down to the road map, then the four stages light up in order
      camTo(CAM.road, 10.6, 1.0, "power3.inOut");
      var LIFT = -6 / CAM.road.S; // 6 screen px
      var STAGES = [
        { k: "plan", at: 13.0 },
        { k: "invite", at: 13.9 },
        { k: "arrange", at: 15.0 },
        { k: "celebrate", at: 15.7 }
      ];
      STAGES.forEach(function (st, i) {
        var k = st.k, at = st.at, n = i + 1;
        if (i > 0) handOff([$("ring-" + STAGES[i - 1].k)], at);
        ringIn(k, at, 0.55);
        tl.fromTo($("ring-" + k), { y: 0 }, { y: LIFT, duration: 0.55, ease: "power3.out" }, at);
        tl.fromTo($("lift-" + k), { y: 0 }, { y: LIFT, duration: 0.55, ease: "power3.out" }, at);
        tl.fromTo($("liftshadow-" + k), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, at);
        // text column 1-2-3-4 assembles in sync
        if (n > 1) tl.fromTo($("link-" + n), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, at - 0.08);
        tl.fromTo($("dot-" + n), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, at + 0.04);
        tl.fromTo($("name-" + n), { x: 26, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, at + 0.12);
      });
      // held read from ~15.9s to the end (no exits — the root transition is the exit)

      window.__timelines = window.__timelines || {};
      window.__timelines["03-home"] = tl;
    })();
  </script>
</template>
