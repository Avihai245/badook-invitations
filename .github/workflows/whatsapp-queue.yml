# Sends WhatsApp invitations still waiting in the queue (a host closed the page mid-send, or a message
# is waiting to be retried after Meta's rate limit). Same repository secrets as the RSVP summary:
# INVITES_CRON_URL = the site and INVITES_CRON_SECRET = the app's INVITES_CRON_SECRET.
name: WhatsApp queue

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send what is queued
        env:
          URL: ${{ secrets.INVITES_CRON_URL }}
          SECRET: ${{ secrets.INVITES_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "INVITES_CRON_URL / INVITES_CRON_SECRET are not set — nothing to do."
            exit 0
          fi
          curl -fsS --max-time 120 -X POST -H "authorization: Bearer $SECRET" "${URL%/}/api/cron/whatsapp"
