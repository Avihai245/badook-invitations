# The live gallery's housekeeping: files of deleted photos and videos leave storage, uploads that never
# finished go after two days (the app also does this by itself on its own traffic). Same repository
# secrets as the RSVP summary: INVITES_CRON_URL = the site and INVITES_CRON_SECRET = the app's
# INVITES_CRON_SECRET. Without them the job does nothing.
name: Gallery housekeeping

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clean up
        env:
          URL: ${{ secrets.INVITES_CRON_URL }}
          SECRET: ${{ secrets.INVITES_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "INVITES_CRON_URL / INVITES_CRON_SECRET are not set — nothing to do."
            exit 0
          fi
          curl -fsS --max-time 120 -X POST -H "authorization: Bearer $SECRET" "${URL%/}/api/cron/gallery"
